# Afterlife stacks index -- consumed by `afterlife doctor` (af-doctor). Schema v1. Written 2026-11-06.
# Key = canonical arch id. `support` uses the README legend: supported | proxy | untested.
# NOTHING here is "supported" until `afterlife bench` + the verification gate pass: current status is `untested` for all rows
# except where marked proxy. Paths are relative to this file.
schema: 1
updated: "2026-11-06"
arches:
  sm_70:
    cards: ["Tesla V100 16GB PCIe", "Tesla V100 SXM2 32GB (M.2/OCuLink eGPU)"]
    vendor: nvidia
    support: untested
    recommended: nvidia-legacy
    alternatives: [nvidia-legacy-vllm-1cat]
    cliff: "CUDA 13 dropped sm_70; R580 last driver; torch 2.15 reportedly drops sm_70 wheels (from SPEC, unverified)"
  sm_61:
    cards: ["GTX 1060 (PROXY for Tesla P40)", "Tesla P40", "GTX 10-series"]
    vendor: nvidia
    support: proxy
    proxy_note: "Lab target is a GTX 1060 standing in for a P40; not the same board."
    recommended: nvidia-legacy
    alternatives: []        # 1Cat-vLLM is sm_70 only
  gfx906:
    cards: ["Instinct MI50 (lab: 16GB board)", "Instinct MI60", "Radeon VII", "Radeon Pro VII"]
    vendor: amd
    support: untested
    recommended: gfx906
    alternatives: [gfx906-vllm]
    baseline: vulkan          # doctor should always mention the Vulkan baseline for AMD
    cliff: "ROCm unsupported gfx906 officially; Ollama 0.13 dropped gfx906 (from SPEC, unverified)"
  sm_86:
    cards: ["RTX 3060 12GB"]
    vendor: nvidia
    support: untested
    role: control
    recommended: control-sm86
    alternatives: []
stacks:
  nvidia-legacy:          {dir: nvidia-legacy,          manifest: nvidia-legacy/stack.yaml,          dockerfile: nvidia-legacy/Dockerfile,          install: nvidia-legacy/install.sh,          driver: "580.196.07", cuda: "12.9.1", torch: "2.14.0+cu126", llama_cpp: "b12182"}
  nvidia-legacy-vllm-1cat: {dir: nvidia-legacy-vllm-1cat, manifest: nvidia-legacy-vllm-1cat/stack.yaml, dockerfile: nvidia-legacy-vllm-1cat/Dockerfile, install: nvidia-legacy-vllm-1cat/install.sh, driver: "580.x", cuda: "12.8.1", torch: "2.10.0", vllm: "1cat 1.5.2", separate_env: true}
  gfx906:                 {dir: gfx906,                 manifest: gfx906/stack.yaml,                 dockerfile: gfx906/Dockerfile,                 install: gfx906/install.sh,                 rocm: "7.14.0-gfx906+20261018172427", llama_cpp: "b12182"}
  gfx906-vllm:            {dir: gfx906-vllm,            manifest: gfx906-vllm/stack.yaml,            dockerfile: gfx906-vllm/Dockerfile,            install: gfx906-vllm/install.sh,            vllm: "ai-infos mobydick v0.30.0.x", separate_env: true}
  control-sm86:           {dir: control-sm86,           manifest: control-sm86/stack.yaml,           dockerfile: control-sm86/Dockerfile,           install: control-sm86/install.sh,           driver: "595.80", cuda: "13.4.3", torch: "2.15.0", llama_cpp: "b12182"}
