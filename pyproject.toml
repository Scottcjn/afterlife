[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterlife-gpu"
version = "0.1.0"
description = "Pinned, tested software stacks and a doctor/bench CLI for vendor-dropped datacenter GPUs (V100, Pascal, MI50)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["gpu", "cuda", "rocm", "v100", "mi50", "llama.cpp", "legacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]
# Runtime is stdlib-only (tomllib on 3.11+, JSON fallback on 3.10).
dependencies = []

[project.urls]
Homepage = "https://github.com/Scottcjn/afterlife"
Source = "https://github.com/Scottcjn/afterlife"
Issues = "https://github.com/Scottcjn/afterlife/issues"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
afterlife = "afterlife.cli:main"

[tool.setuptools.packages.find]
include = ["afterlife*"]

# cliffs.py loads cliff_db.{yaml,json} from the package root via __file__,
# so they MUST ship inside the wheel or `import afterlife.cliffs` crashes.
[tool.setuptools.package-data]
afterlife = ["cliff_db.yaml", "cliff_db.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

# PyYAML ships no type stubs; it's an optional dependency (extras = "yaml").
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
